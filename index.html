<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Surprise 🎉</title>

<style>
body {
  margin: 0;
  background: #ffb6d9; /* Soft pink */
  font-family: "Poppins", sans-serif;
  overflow-x: hidden;
}

/* Baby */
.baby {
  width: 230px;
  position: absolute;
  left: 50%;
  top: 40%;
  transform: translate(-50%, -50%);
  animation: bounce 2s infinite ease-in-out;
}

@keyframes bounce {
  0% { transform: translate(-50%, -46%); }
  50% { transform: translate(-50%, -54%); }
  100% { transform: translate(-50%, -46%); }
}

/* Birthday Popup */
#birthday-popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 90, 150, 0.88);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 50;
}

.birthday-box {
  background: #fff;
  padding: 30px 40px;
  border-radius: 20px;
  max-width: 90%;
  text-align: center;
  color: #ff2e87;
  font-size: 18px;
  font-weight: 600;
  animation: pop 0.5s ease-out;
  box-shadow: 0 0 15px rgba(0,0,0,0.25);
  line-height: 1.5;
}

.birthday-box button {
  margin-top: 18px;
  padding: 10px 22px;
  background: #ff2e87;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  cursor: pointer;
}

@keyframes pop {
  0% { transform: scale(0.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* Stable note below baby */
#popup {
  position: absolute;
  top: 72%;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0); 
  padding: 10px 20px;
  font-size: 18px;
  color: #ff2e87;
  font-weight: 600;
  max-width: 85%;
  text-align: center;
  border-radius: 0;
}

/* Floating hearts */
@keyframes floatUp {
  0% { bottom: 0; opacity: 1; }
  100% { bottom: 300px; opacity: 0; }
}
.heart {
  position: absolute;
  color: #ff2e87;
  font-size: 28px;
  animation: floatUp 2.5s linear infinite;
}
</style>
</head>

<body>
<!-- Birthday music -->
<audio id="bgm" autoplay loop>
    <source src="happy-birthday-357371.mp3
" type="audio/mpeg">
</audio>
<!-- Birthday Popup -->
<div id="birthday-popup">
  <div class="birthday-box">

    <p class="birthday-text">
      💘 <b>Happy Birthday, bestie!</b><br>
      Ye chhota sa surprise meri taraf se ❤️🥰
    </p>

    <button onclick="closePopup()">OK</button>
  </div>
</div>

<!-- Baby Image -->
<img class="baby" src="https://i.ibb.co/4ZGsXpck/Screenshot-2025-11-27-112707.png">

<!-- Stable Note -->
<div id="popup"></div>

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* Popup Close Function */
function closePopup() {
  document.getElementById("birthday-popup").style.display = "none";
}

/* Confetti on load */
confetti({
  particleCount: 180,
  spread: 120,
  origin: { y: 0.3 }
});

/* Floating Hearts */
function createHeart() {
  const h = document.createElement("div");
  h.className = "heart";
  h.style.left = Math.random() * window.innerWidth + "px";
  h.innerHTML = "💗";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 2500);
}
setInterval(createHeart, 350);

/* Birthday Note Below Baby */
const note = `
💘 Happy Birthday, bestie! 🎂✨<br><br>
Aaj tum officially ek saal aur zyaada cute ho gayi ho —<br>
aur mujhe still samajh nahi aa raha tum insaan ho ya<br>
limited-edition heart stealer version 2.0 💗😳<br><br>

Sach bolu toh,<br>
birthday tumhara hai,<br>
par overload cuteness-attacks mujhe ho rahe hain. 😅🔥<br><br>

Cake se jealous mat hona…<br>
kyunki today you're the sweetest thing here. 🍰😉💕<br><br>

Bas promise karo —<br>
aaj bohot saari smile, selfie<br>
aur thoda sa attitude dogi,<br>
baaki flirting ka kaam main sambhaal lunga. 😎💗
`;

document.getElementById("popup").innerHTML = note;
</script>

</body>
</html>
